<style>
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
  }

  .header-inner {
    width: 90%;
    max-width: 1100px;
    margin: 18px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 10px 14px 10px 18px;
    background: var(--surface-card, rgba(30, 12, 18, 0.72));
    border: 1px solid var(--surface-border, rgba(255, 255, 255, 0.08));
    border-radius: var(--radius-pill, 999px);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
  }

  /* ---------- Brand ---------- */
  .brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex-shrink: 0;
  }

  .brand-icon {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--primary-soft, rgba(251, 113, 133, 0.16));
    border: 1px solid rgba(251, 113, 133, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary, #fb7185);
    flex-shrink: 0;
  }

  .brand-icon .material-symbols-outlined {
    font-size: 17px;
    font-variation-settings: 'FILL' 1;
  }

  .brand-word {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 16.5px;
    letter-spacing: -0.01em;
    color: #ffffff;
    white-space: nowrap;
  }

  .brand-word em {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    color: var(--primary, #fb7185);
    background: linear-gradient(135deg, #fb7185 0%, #fda4af 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-left: 2px;
  }

  /* ---------- Desktop nav ---------- */
  .nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--surface-border, rgba(255, 255, 255, 0.06));
    border-radius: var(--radius-pill, 999px);
    padding: 4px;
  }

  .nav-link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    color: rgba(255, 241, 242, 0.62);
    padding: 8px 16px;
    border-radius: var(--radius-pill, 999px);
    transition: all 0.25s ease;
    white-space: nowrap;
  }

  .nav-link:hover {
    color: #ffffff;
  }

  .nav-link.active {
    color: #ffffff;
    background: var(--primary-soft, rgba(251, 113, 133, 0.18));
    box-shadow: inset 0 0 0 1px rgba(251, 113, 133, 0.35);
  }

  .nav-link--soon {
    color: rgba(255, 241, 242, 0.4);
    cursor: default;
  }

  .nav-link--soon:hover {
    color: rgba(255, 241, 242, 0.4);
  }

  .nav-soon-tag {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--primary, #fb7185);
    background: var(--primary-soft, rgba(251, 113, 133, 0.16));
    border: 1px solid rgba(251, 113, 133, 0.28);
    padding: 2px 7px;
    border-radius: var(--radius-pill, 999px);
  }

  /* ---------- Right side actions ---------- */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .header-cta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    text-decoration: none;
    color: #1a0a0e;
    background: linear-gradient(135deg, #fb7185 0%, #fda4af 100%);
    padding: 9px 18px;
    border-radius: var(--radius-pill, 999px);
    white-space: nowrap;
    box-shadow: 0 8px 20px var(--primary-glow, rgba(251, 113, 133, 0.3));
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .header-cta .material-symbols-outlined {
    font-size: 16px;
  }

  .header-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px var(--primary-glow, rgba(251, 113, 133, 0.4));
  }

  .nav-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--surface-border, rgba(255, 255, 255, 0.08));
    color: #ffffff;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ---------- Mobile dropdown nav ---------- */
  .nav-links-mobile {
    display: none;
    flex-direction: column;
    gap: 4px;
    width: 90%;
    max-width: 1100px;
    margin: 10px auto 0;
    padding: 12px;
    background: var(--surface-card, rgba(30, 12, 18, 0.9));
    border: 1px solid var(--surface-border, rgba(255, 255, 255, 0.08));
    border-radius: var(--radius-xl, 22px);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4);
  }

  .nav-links-mobile.is-open {
    display: flex;
  }

  .nav-link-mobile {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
    color: rgba(255, 241, 242, 0.7);
    padding: 12px 14px;
    border-radius: 14px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .nav-link-mobile .material-symbols-outlined {
    font-size: 19px;
  }

  .nav-link-mobile:hover {
    background: rgba(255, 255, 255, 0.04);
    color: #ffffff;
  }

  .nav-link-mobile.active {
    color: #ffffff;
    background: var(--primary-soft, rgba(251, 113, 133, 0.16));
    box-shadow: inset 0 0 0 1px rgba(251, 113, 133, 0.3);
  }

  .nav-link-mobile--soon {
    color: rgba(255, 241, 242, 0.4);
    justify-content: space-between;
  }

  .nav-link-mobile--soon .nav-soon-tag {
    margin-left: auto;
  }

  .nav-link-mobile-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    text-decoration: none;
    color: #1a0a0e;
    background: linear-gradient(135deg, #fb7185 0%, #fda4af 100%);
    padding: 12px 14px;
    border-radius: 14px;
    margin-top: 6px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 720px) {
    .nav-links,
    .header-cta {
      display: none;
    }

    .nav-toggle {
      display: flex;
    }

    .header-inner {
      margin-top: 14px;
    }
  }
</style>

<script>
  (function () {
    var toggle = document.getElementById('navToggle');
    var toggleIcon = document.getElementById('navToggleIcon');
    var mobileNav = document.getElementById('navLinksMobile');
    if (!toggle || !mobileNav) return;

    toggle.addEventListener('click', function () {
      var isOpen = mobileNav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      toggleIcon.textContent = isOpen ? 'close' : 'menu';
    });
  })();
</script>
