<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For You</title>
  
  <link rel="stylesheet" href="common.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    main {
      flex: 1;
      width: 90%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 0;
    }

    .hero-stage {
      text-align: left;
      margin-bottom: 40px;
    }

    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(30px, 5vw, 44px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .hero-sub {
      font-size: 16px;
      color: var(--text-muted);
      max-width: 520px;
      line-height: 1.6;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .module-card {
      background: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-xl);
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .module-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .card-description {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .card-footer-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid var(--surface-border);
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Header Placeholder -->
  <div id="header-container"></div>

  <main>
    <section class="hero-stage">
      <h1 class="hero-title">Create & Share Notes</h1>
      <p class="hero-sub">Write a personal letter and generate a unique link to send directly to your recipient.</p>
    </section>

    <div class="modules-grid">
      <a href="free1.html" class="module-card">
        <div>
          <div class="card-head">
            <div class="card-icon">
              <span class="material-symbols-outlined" style="font-size: 20px;">drafts</span>
            </div>
          </div>
          <h2 class="card-title">Love Letter</h2>
          <p class="card-description">A digital letter template that formats custom text into an interactive webpage presentation.</p>
        </div>
        <div class="card-footer-cta">
          <span>Open Letter</span>
          <span class="material-symbols-outlined" style="font-size: 16px;">arrow_forward</span>
        </div>
      </a>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-container"></div>

  <script src="common.js"></script>
</body>
</html>
