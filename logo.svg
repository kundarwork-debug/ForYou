
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Envelope Body Gradient -->
    <linearGradient id="bodyGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>

    <!-- Top Flap Gradient -->
    <linearGradient id="flapGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>

    <!-- Bottom Envelope Crease Gradient -->
    <linearGradient id="creaseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff1f2" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Wax Seal Gradient -->
    <linearGradient id="sealGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#glowGrad)"/>

  <!-- Envelope Main Body -->
  <rect x="20" y="36" width="80" height="52" rx="8" fill="url(#bodyGrad)" filter="url(#softShadow)"/>

  <!-- Envelope Side & Bottom Folds -->
  <path d="M20 84 L52 58 L20 40 Z" fill="url(#creaseGrad)"/>
  <path d="M100 84 L68 58 L100 40 Z" fill="url(#creaseGrad)"/>
  <path d="M20 88 L60 58 L100 88 H20 Z" fill="#ffe4e6" fill-opacity="0.8"/>

  <!-- Envelope Top Flap -->
  <path d="M20 38 Q20 36 22 36 L98 36 Q100 36 100 38 L62 65 Q60 66.5 58 65 Z" fill="url(#flapGrad)"/>

  <!-- Wax Seal -->
  <circle cx="60" cy="63" r="10" fill="url(#sealGrad)"/>

  <!-- Inner Heart Emblem -->
  <path d="M60 68 C60 68 55 64.5 55 61.8 C55 60 56.5 58.8 58 58.8 C59 58.8 59.7 59.4 60 60 C60.3 59.4 61 58.8 62 58.8 C63.5 58.8 65 60 65 61.8 C65 64.5 60 68 60 68 Z" fill="#ffffff" opacity="0.95"/>
</svg>
